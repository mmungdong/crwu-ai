# 本包作为 bundle 被 profile 加载时插入的行（本仓：crwu-ai/plugins/dsh-crwu-workbench）。
# 安装：dsh plugin --profile web add <tarball 或包名>  →  重启 profile。
# （`dsh plugin add` 会自动把包名登记进 profile 的 dsh.profile.bundles。）
#
# 所有环境相关的值统一放在 `config/crwu-workbench.yml`。开发时可用 configFile 指向另一份；
# TGZ 安装后留空会自动读取包内那份。
- insert:
    - id: crwu-workbench
      name: dsh-crwu-workbench
      config:
        configFile: ''

# CRWU 审核技能随插件发布：本包 `skills/` 是插件专属技能，`common/skills/` 是打包前
# 从 `plugins/common/skills/` 同步进来的公共技能（crwu-dws / crwu-h3yun-*）。
# 路径用 `baseUrl`（= 本包目录）解析，所以 `link:` 开发与员工 tarball 安装指向的都是包内。
- insert:
    - id: crwu-workbench-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        # 独立 provider 名：与部署默认那行共存，不覆盖它。
        providerName: crwu-audit-workbench
        # 只扫本包内的两个目录；用户/项目技能根仍由部署默认那行负责（避免重复扫描）。
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('common/skills/', baseUrl))"
