# 本包作为 bundle 被 profile 加载时插入的行（本仓：crwu-ai/plugins/dsh-crwu-workbench）。
# 安装：dsh plugin --profile web add <tarball 或包名>  →  重启 profile。
# （`dsh plugin add` 会自动把包名登记进 profile 的 dsh.profile.bundles。）
#
# 所有环境相关的值统一放在 `config/crwu-workbench.yml`。开发时可用 configFile 指向另一份；
# TGZ 安装后留空会自动读取包内那份。
- insert:
    - id: crwu-workbench
      name: dsh-crwu-workbench
      config:
        configFile: ''

# CRWU 审核技能随插件发布：本包 `skills/` 是插件专属技能，`common/skills/` 是打包前
# 从 `plugins/common/skills/` 同步进来的公共技能（crwu-dws / crwu-h3yun-*）。
#
# 路径**不能**写成 `new URL('skills/', baseUrl)`：profile 的整棵树是「补丁层挂在 profile 的空根
# 配置上」，所以 bundle patch 里的 `baseUrl` 锚在 **profile 目录**（`<profile>/`），不是包目录 ——
# 那样会指向 `<profile>/skills/`（不存在），provider 挂上了却**静默**贡献 0 个技能。2026-09-22
# 实测踩到：技能表里一个 crwu 技能都没有，而 agent preset 里同样写法的行是好的（preset 是按文件
# 加载的，baseUrl 才是 preset 目录）。
#
# 用 Node 的模块解析按**包名**定位包目录：link 开发、员工 tarball、装到别的布局都对；
# 解析不出来会直接抛错（不静默降级成"没有技能"）。
- insert:
    - id: crwu-workbench-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        # 独立 provider 名：与部署默认那行共存，不覆盖它。
        providerName: crwu-workbench
        # 只扫本包内的两个目录；用户/项目技能根仍由部署默认那行负责（避免重复扫描）。
        includeDefaultRoots: false
        customSkillDirs: !!js >-
          (() => {
            const path = process.getBuiltinModule('node:path');
            const { createRequire } = process.getBuiltinModule('node:module');
            const root = path.dirname(createRequire(baseUrl + 'package.json').resolve('dsh-crwu-workbench/package.json'));
            return [path.join(root, 'skills'), path.join(root, 'common/skills')];
          })()
