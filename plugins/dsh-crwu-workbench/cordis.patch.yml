# 本包作为 bundle 被 profile 加载时插入的行（本仓：crwu-ai/plugins/dsh-crwu-workbench）。
# 安装：dsh plugin --profile web add <tarball 或包名>  →  重启 profile。
# （`dsh plugin add` 会自动把包名登记进 profile 的 dsh.profile.bundles。）
#
# 所有环境相关的值都在这里，不进代码：换了组织/OSS/工作空间只改这里。
- insert:
    - id: crwu-workbench
      name: dsh-crwu-workbench
      config:
        # ── 案例根目录 ────────────────────────────────────────────────
        # 审核产物写到哪里。留空 = 不自动采用，必须在面板里显式选一个工作空间。
        # 正常情况下由「① 中瑞世联工作空间」覆盖，这里只是兜底。
        caseRoot: ''
        # 清单里期望命中的 DSH 工作空间名（找不到就要求手动选）
        preferWorkspaceTitle: 中瑞世联工作空间

        # ── 环境清单（远程） ──────────────────────────────────────────
        # 每个组织应指向自己的 OSS。清单里有 binaries / services / oss 段。
        manifestUrl: https://crwu-only-workspace.oss-cn-beijing.aliyuncs.com/crwu-env-manifest.json
        installDocUrl: https://crwu-only-workspace.oss-cn-beijing.aliyuncs.com/crwu-env-install.md

        # ── 氚云 ─────────────────────────────────────────────────────
        formName: 报告审核

        # ── OSS 交付件回传 ────────────────────────────────────────────
        # 留空 = 采用远程清单 oss 段里的值；这里可覆盖。
        ossBucket: ''
        ossPrefix: ''
        ossEndpoint: ''
        # signed（默认，1 小时签名 URL，内部材料不要改 public）或 public
        ossLinkMode: signed
        ossLinkTtlSeconds: 3600
        autoUpload: true

        # ── 单条并发与重启 ────────────────────────────────────────────
        # 同一时间只允许一条审核；同一条报告再次发起 = 停掉旧的 + 带时间戳重启
        singleAuditOnly: true
        # 审核只允许挂在顶层会话下（子代理深度 1），不允许嵌套
        requireTopLevelParent: true

# CRWU 审核技能随插件发布：本包 `skills/` 是插件专属技能，`common/skills/` 是打包前
# 从 `plugins/common/skills/` 同步进来的公共技能（crwu-dws / crwu-h3yun-*）。
# 路径用 `baseUrl`（= 本包目录）解析，所以 `link:` 开发与员工 tarball 安装指向的都是包内。
- insert:
    - id: crwu-workbench-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        # 独立 provider 名：与部署默认那行共存，不覆盖它。
        providerName: crwu-audit-workbench
        # 只扫本包内的两个目录；用户/项目技能根仍由部署默认那行负责（避免重复扫描）。
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('common/skills/', baseUrl))"
