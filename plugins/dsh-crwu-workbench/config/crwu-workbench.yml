schemaVersion: 1

workspace:
  caseRoot: ''
  preferTitle: 中瑞世联工作空间
  requireTopLevelParent: true

report:
  formName: 报告审核

audit:
  autoUpload: true

# 房地产估值（首期：住宅市场法）。
valuation:
  browser:
    # CLI 直接吃的站点清单（顶层数组）。相对**包根**解析：link 开发、TGZ 安装都对；
    # 不写绝对路径，也不允许模型提交这一个值。
    sitesFile: skills/biz/crwu-biz-valuation-realestate/assets/browser-sites.json
    # 来源分两档**只是展示口径**（协议 39 起都不再拦页面）：
    # 链家未登录时按业务口径改用房天下与 58，来源策略与原因随交接交给父会话。
    # 这两项**不进**全局 required 环境列表：它们只影响估值这一页的来源展示。
    #
    # ⚠️ 留空 = **没有必需来源**（不再回退成"全部必需"）。配置成空之后，页面上
    # 任何来源未登录都只是能力事实，不阻止填写与启动。
    requiredSiteIds: []
    # 只展示、不阻塞的来源。业务案例不一定要每一站都有。
    optionalSiteIds:
      - lianjia
    # 登录任务里遇到**可见**挑战时，是否允许调用固定恢复策略辅助一次。
    # 无论辅助是否成功，释放门禁都只认权威 status（Cookie 存在不算登录）。
    assistLoginChallenge: true

  # **表格计算程序**（协议 39）：真实重算只能经受控的表格引擎执行，本仓**不随包发布**
  # LibreOffice / Excel，所以它只能由部署显式指定。
  #
  # 空串（默认）= 本部署没有表格计算程序 = 重算 `unavailable`：报告仍产出公式正确的底稿，
  # 但完成判定上限是 `partial`（标注「待重算」）。**模型自写的"重算成功"记录不会被采信** ——
  # 探测不到程序时那种记录必然是编的。
  #
  # 非空时必须是**绝对路径**（不要把 PATH 上的同名命令当成引擎：算出来的数与"没人算过"一样不可信）。
  recalculation:
    enginePath: ''

  # 业务知识的**身份已验证本地镜像**根（设计稿 §6.1 的第 ④ 级恢复）。
  #
  # 默认留空 = **不启用镜像**：正文一律实时从「中瑞世联业务知识库」取回。
  # 填一个绝对路径也不会自动生效 —— 那个目录下的 `_manifest.json` 必须声明
  # `spaceName: 中瑞世联业务知识库`，且每个文件字节 digest 与 manifest 一致；
  # 目录名像业务库不算身份证明（本机现有缓存实际是**审核库**）。
  # 这个值不进模型可见结果，也不接受模型提交。
  knowledge:
    mirrorRoot: ''
    # **入口 Wiki**：本资产类型的唯一业务入口，**相对知识库根**的库内路径（不是文件系统路径）。
    #
    # 与技能 `crwu-biz-valuation-realestate/references/knowledge-routing.md` 声明的入口逐字一致。
    # 入口正文按需在线读取；它链接的方法 / 案例 / 参数 / 模板正文由会话按条件逐步读取。
    wikiPath: 01 估值与测算/01 房地产/wiki.adoc
    # ⚠️ **遗留键**：知识库侧 manifest 的位置（相对知识库根）。
    #
    # 协议 39 起业务入口是上面的 `wikiPath`（入口 Wiki + 库内相对链接）。本键只为让仍在盘上的
    # 旧配置与旧案例继续可读而保留：取数仍走 manifest 时，工具结果里会带一条迁移提示。
    # **新部署不要再配它**，也不要再往知识库里写新的 manifest。
    manifestPath: 01 估值与测算/01 房地产/00-知识目录与必需项

oss:
  # 这里只剩**审核产物**那一个私有 Bucket。
  #
  # 原来还有一个 `readonly`（crwu-only-workspace）用来分发环境清单、安装说明和插件 TGZ：
  # 2026-09-25 整条下掉了 —— 二进制随插件发布在包内 `bin/<平台>/`，插件本身改从 npm 安装。
  # 少一个远端数据源就少一条"别人能远程改你机器上的解释权"的通道。
  protected:
    bucket: crwu-workspace
    endpoint: oss-cn-beijing.aliyuncs.com
    baseUrl: https://crwu-workspace.oss-cn-beijing.aliyuncs.com
    auditPrefix: crwu/audit
    linkMode: signed
    linkTtlSeconds: 3600
