schemaVersion: 1

workspace:
  caseRoot: ''
  preferTitle: 中瑞世联工作空间
  requireTopLevelParent: true

report:
  formName: 报告审核

audit:
  autoUpload: true

oss:
  # 这里只剩**审核产物**那一个私有 Bucket。
  #
  # 原来还有一个 `readonly`（crwu-only-workspace）用来分发环境清单、安装说明和插件 TGZ：
  # 2026-09-25 整条下掉了 —— 二进制随插件发布在包内 `bin/<平台>/`，插件本身改从 npm 安装。
  # 少一个远端数据源就少一条"别人能远程改你机器上的解释权"的通道。
  protected:
    bucket: crwu-workspace
    endpoint: oss-cn-beijing.aliyuncs.com
    baseUrl: https://crwu-workspace.oss-cn-beijing.aliyuncs.com
    auditPrefix: crwu/audit
    linkMode: signed
    linkTtlSeconds: 3600
