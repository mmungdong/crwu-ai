# 本包作为 bundle 被 profile 加载时插入的行。
# 安装：dsh plugin --profile web add <pkg>  → 再把包名加进
# ~/.dsh/profiles/web/package.json 的 dsh.profile.bundles，重启 profile。
#
# 所有环境相关的值都在这里，不进代码：换了组织/OSS/工作空间只改这里。
- insert:
    - id: crwu-workbench
      name: dsh-crwu-workbench
      config:
        # ── 案例根目录 ────────────────────────────────────────────────
        # 审核产物写到哪里。留空 = 不自动采用，必须在面板里显式选一个工作空间。
        # 正常情况下由「① 中瑞世联工作空间」覆盖，这里只是兜底。
        caseRoot: ''
        # 清单里期望命中的 DSH 工作空间名（找不到就要求手动选）
        preferWorkspaceTitle: 中瑞世联工作空间

        # ── 环境清单（远程） ──────────────────────────────────────────
        # 每个组织应指向自己的 OSS。清单里有 binaries / services / oss 段。
        manifestUrl: https://crwu-only-workspace.oss-cn-beijing.aliyuncs.com/crwu-env-manifest.json
        installDocUrl: https://crwu-only-workspace.oss-cn-beijing.aliyuncs.com/crwu-env-install.md

        # ── 氚云 ─────────────────────────────────────────────────────
        formName: 报告审核

        # ── OSS 交付件回传 ────────────────────────────────────────────
        # 留空 = 采用远程清单 oss 段里的值；这里可覆盖。
        ossBucket: ''
        ossPrefix: ''
        ossEndpoint: ''
        # signed（默认，1 小时签名 URL，内部材料不要改 public）或 public
        ossLinkMode: signed
        ossLinkTtlSeconds: 3600
        autoUpload: true

        # ── 单条并发与重启 ────────────────────────────────────────────
        # 同一时间只允许一条审核；同一条报告再次发起 = 停掉旧的 + 带时间戳重启
        singleAuditOnly: true
        # 审核只允许挂在顶层会话下（子代理深度 1），不允许嵌套
        requireTopLevelParent: true
