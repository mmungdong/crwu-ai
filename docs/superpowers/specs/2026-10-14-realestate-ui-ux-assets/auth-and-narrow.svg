<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">房地产估值：来源门禁与窄面板深色设计</title><desc id="desc">设计方案静态示意图，使用虚构文件与状态，不代表当前运行界面。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Heiti SC,sans-serif">
<rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F4F5F7"/>
<text x="36" y="50" font-size="22" font-weight="600" fill="#1D1D1F">案例来源门禁</text>
<text x="36" y="78" font-size="14" font-weight="400" fill="#6E6E73">检查、登录与页面验证分别说明，动作与状态形成闭环。</text>
