name: release-plugin

# 插件包（plugins/dsh-crwu-workbench）按 npm 分发，发布必须由 tag 驱动、由门禁把门：
#   1. 打 tag（plugin-v0.0.1）→ 本工作流
#   2. 校验 tag 与 package.json / VERSION / CHANGELOG 一致
#   3. 跑完整门禁（npm run check）+ 产物自检（pack:assert）
#   4. npm publish --provenance（走 NPM_TOKEN，附构建来源证明）
#
# 为什么是 `plugin-v*` 前缀：本仓还装着 Go CLI，将来 CLI 的 release tag 用 `v*`；
# 两种形态各自发版，前缀把它们分开，避免「打了一个 tag 同时触发两条发布」。
#
# 为什么发布前还要再跑一次门禁：CI 跑在 push 上，tag 可能指向一个没经过 CI 的提交。

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只打包与校验，不真正发布'
        type: boolean
        default: true

concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 第一条：**先真的把两个平台的六个二进制装配出来**，作为 artifact 交给发布作业。
  #
  # 为什么必须在发布前装配、不能只靠工作树：`npm pack` 打的是工作树里的 `bin/`。
  # 干净 runner 上没有它（`bin/` 是 gitignore 的构建产物），于是发出去的包会「插件在、
  # crwu/dws/ossutil 不在」——只有员工装完才发现。
  #
  # 为什么只有一个 job 就够：`make build` 在 macOS 上**交叉编译**出 `bin/darwin/crwu` 与
  # `bin/windows/crwu.exe` 两份；`sync-binaries.mjs` 再把 ossutil（阿里云官方包）与 dws
  # （npm 包 `dingtalk-workspace-cli` 的 assets）按清单哈希落到各平台目录，并写
  # `bin/manifest.json`。所以 darwin-arm64 与 win32-x64 能在同一台 macOS runner 上齐备。
  binaries:
    runs-on: macos-14
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/dsh-crwu-workbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/dsh-crwu-workbench/package-lock.json

      - run: npm ci

      - name: cross-compile crwu (darwin + windows)
        working-directory: .
        run: make build

      - name: stage the six binaries and write bin/manifest.json
        run: node scripts/sync-binaries.mjs

      - name: verify the staging against its own manifest
        run: node scripts/sync-binaries.mjs --check

      - uses: actions/upload-artifact@v4
        with:
          name: crwu-workbench-bin
          path: plugins/dsh-crwu-workbench/bin
          if-no-files-found: error
          retention-days: 3

  # 第二个：**在 Windows 上真的把发布二进制启动一次**。
  #
  # 为什么不能只看哈希：`binaries` job 在 macOS 上交叉编译六个二进制并核对清单/哈希，那只证明
  # 「文件没变」，不证明「在 Windows 上能跑」。坏 exe、架构不对（「不是有效的 Win32 应用程序」）、
  # 缺 DLL、被杀软拦下 —— 这几种在 macOS runner 上永远绿，员工装完才发现。
  #
  # 所以：下载同一份 staged `bin` artifact → 校验 manifest 与 SHA-256 → 复制三个 .exe 到
  # runner 临时目录（HOME/USERPROFILE/TMPDIR 一并指过去）→ 各跑一条无副作用命令 →
  # 断言发布树没有 `.dws` 之类残留。publish 依赖它：Windows 冒烟不过就不许发布。
  windows-binary-smoke:
    needs: binaries
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/dsh-crwu-workbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: crwu-workbench-bin
          path: plugins/dsh-crwu-workbench/bin

      # win32-arm64 的策略也在这里显式验一次：**没有随包二进制就不许顶替**。
      # 这条在 Windows runner 上跑，才是对真实平台键的检查。
      - name: smoke the win32-x64 binaries
        run: node scripts/smoke-windows-binaries.mjs --platform=win32-x64

      - name: an undeclared platform must fail loudly (no arch fallback)
        run: |
          # 这一步**预期** `node` 退出码非零，所以它是一条「反向」断言：
          # ① 先把退出码存进变量 —— `$LASTEXITCODE` 会被后面的每条原生命令覆盖；
          # ② 断言之后必须**显式 `exit 0`**。GitHub 的 pwsh runner 在脚本末尾会用
          #    `$LASTEXITCODE` 当步骤退出码（内置 pwsh 壳的 `$ErrorActionPreference='stop'`
          #    之外还会 `exit $LASTEXITCODE`），`Write-Host` **不会**把它清成 0 ——
          #    于是「预期失败」的那一步会真的把 job 判红，依赖它的 publish 永远起不来。
          node scripts/smoke-windows-binaries.mjs --platform=win32-arm64
          $smokeExit = $LASTEXITCODE
          if ($smokeExit -eq 0) { throw "win32-arm64 没有随包二进制，冒烟却报成功" }
          Write-Host "OK  win32-arm64 被如实拒绝（退出码 $smokeExit）"
          exit 0

  publish:
    needs: [binaries, windows-binary-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: plugins/dsh-crwu-workbench
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/dsh-crwu-workbench/package-lock.json
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # 把上面那个 job 装配好的 bin/ 放回包目录：发布作业自己**不构建**，只用已经过
      # 清单校验的产物，避免「发布机上现装一份、和校验过的那份不是同一份」。
      - uses: actions/download-artifact@v4
        with:
          name: crwu-workbench-bin
          path: plugins/dsh-crwu-workbench/bin

      # 公共技能层是**生成产物**：`common/skills/` 在 `.gitignore` 里，源是 `../common/skills`。
      # 接下来 `npm run check` 的 `skills:check` 会比对这两份，`pack:assert:strict` 又要求
      # tarball 里有 `common/skills/crwu-dws/SKILL.md`（`files` 里也列了 `common/skills/`）——
      # 少了这一步，发布作业会在 `skills:check` 上红（`make plugin-pack` 是靠 `plugin-skills`
      # 生成它的，workflow 必须自己补）。
      - name: sync bundled skills
        run: npm run skills:sync

      - name: tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#plugin-v}"
          pkg="$(node -p "require('./package.json').version")"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag package.json=$pkg VERSION=$file"
          test "$tag" = "$pkg"
          test "$tag" = "$file"

      - name: full gate
        run: npm run check

      # 发布严格模式：两个平台六个二进制 + manifest 必须在**真实 tarball** 里，
      # 且逐个重算 size/sha256 与清单一致；bin/ 下不许有任何未声明的文件。
      - name: packed artifact self-check (strict)
        run: npm run pack:assert:strict

      - name: publish
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 先把「没配 secret」这种最常见的原因**明确点出来**：否则 npm 只会回一句
          # ENEEDAUTH，而 job log 的 REST 接口要仓库 admin 权限才读得到（普通 token 403），
          # 排查的人只能猜。失败原因同时写成 ::error:: 注解（check-run 注解是公开可读的）。
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::仓库没有配置 NPM_TOKEN secret（Settings → Secrets and variables → Actions → New repository secret）"
            exit 1
          fi
          if ! npm publish --provenance 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            node -e "
              const fs = require('fs')
              const lines = String(fs.readFileSync(process.env.RUNNER_TEMP + '/publish.log', 'utf8')).split(/\r?\n/)
              const hits = lines.filter((line) => /(npm error|npm ERR|error code|ENEEDAUTH|EOTP|E403|401|403)/.test(line)).slice(0, 12)
              const body = [...hits, '———— 尾部 ————', ...lines.slice(-12)].join('%0A')
              console.log('::error::' + body.slice(0, 4000))
            "
            exit 1
          fi

      - name: dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run != false }}
        run: echo "dry-run：门禁与产物自检通过，未发布。"
