name: ci

# 本仓两种形态，各自一个 job，互不依赖：
#   1. Go：`cmd/ internal/ tests/` → `crwu` 二进制（根 Makefile）；
#   2. DSH 插件：`plugins/dsh-crwu-workbench/`（TypeScript 源码 → tsdown 双端产物
#      lib/index.js + lib/client.js，并以 tarball / npm 分发给员工）。
# 插件的门禁覆盖：版本一致 → 技能自洽性 → 类型 → 单元/集成测试 → 构建 → tarball 清单 → 产物冒烟。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本从 go.mod 读，避免 workflow 里再写一份。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # 插件在本仓是子目录，所有 npm 命令都在它下面跑。
        working-directory: plugins/dsh-crwu-workbench
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # 锁文件不在仓根，必须显式指路，否则 setup-node 找不到缓存键。
          cache-dependency-path: plugins/dsh-crwu-workbench/package-lock.json

      # npm ci 会执行 prepare（tsdown），所以这一步同时验证「依赖可复现」与「产物可构建」。
      - run: npm ci

      # 技能门禁（技能自洽性 lint + 三个源仓契约测试）。技能必须以副本独立安装后可用，
      # 不得引用仓内目录；契约测试覆盖路由/装配/路径键与 crwu-dws 取数契约。
      # lint 逐层跑：`skills/crwu` 是本仓自研层，**公共层的根是 `../common/skills`**
      # （= 仓里的 `plugins/common/skills`，自洽性规则里被 lint 的那份）；`skills/dws`
      # 是上游 vendored 正文，按 `skills/README.md` 的口径豁免自洽性 lint（其内容一致性由
      # `npm run check` 里的 `dws:check` 用 provenance 摘要守住）。
      #
      # **不能写 `common/skills`**：包目录下那份是 `skills:sync` 从 `plugins/common/skills`
      # 生成的、在 `.gitignore` 里；fresh checkout 上它根本不存在，`kb_tool.py validate`
      # 会以「技能根不存在」exit 1（main 上 ubuntu 这两个 job 一直红就是这个原因）。
      # 只跑一遍：纯内容与 Python 检查，与 OS / Node 版本无关，而 windows runner 上
      # `python3` 不保证在 PATH。
      - name: skill gates
        if: runner.os == 'Linux'
        run: |
          # 门禁只读源码：**不许在包目录里留下 `__pycache__/*.pyc`** —— `files` 里有
          # `skills/crwu/`，残留会被后面的 `pack:assert` 判成「打进了不该发布的东西」
          # （`assert-pack.mjs` 有按路径片段判的残留检查）。
          export PYTHONDONTWRITEBYTECODE=1
          # 日志接口要仓库 admin 权限（普通 token 403），所以失败原因必须落成**公开可读**的
          # check-run 注解 —— 与 windows 那条 annotate 步骤同一口径。2026-09-28 这一步在
          # ubuntu 上一直是红，而注解里只有一句「Process completed with exit code 1」，
          # 连是哪条门禁、为什么都读不出来。
          run_gate() {
            label="$1"; shift
            if "$@" > /tmp/skill-gate.log 2>&1; then
              echo "OK   $label"
              return 0
            fi
            tail -30 /tmp/skill-gate.log
            echo "::error title=skill gate 失败：$label::$(tail -20 /tmp/skill-gate.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            return 1
          }
          status=0
          run_gate "自洽性 lint：skills/crwu" python3 skills/crwu/crwu-dev-audit-skill-maintainer/scripts/kb_tool.py validate --skill-root skills/crwu || status=1
          run_gate "自洽性 lint：../common/skills" python3 skills/crwu/crwu-dev-audit-skill-maintainer/scripts/kb_tool.py validate --skill-root ../common/skills || status=1
          run_gate "维护者源仓契约测试" python3 skills/crwu/crwu-dev-audit-skill-maintainer/scripts/test_audit_skill_maintainer.py || status=1
          run_gate "router 源仓契约测试" python3 skills/crwu/crwu-audit/scripts/test_audit_multiaxis_router.py || status=1
          run_gate "crwu-dws 源仓契约测试" python3 ../common/skills/crwu-dws/scripts/test_dws_source_contract.py || status=1
          exit $status

      # 公共层是**生成产物**：`common/skills/` 在 `.gitignore` 里，源是 `../common/skills`。
      # 下面的 `pack:assert`（tarball 的必需文件里有 `common/skills/crwu-dws/SKILL.md`）与
      # `npm run check` 里的 `skills:check` 都要求它已生成 —— `make plugin-pack` 靠
      # `plugin-skills` 做这一步，CI 之前漏了，所以新鲜 checkout 上这两步也会红。
      - name: sync bundled skills
        run: npm run skills:sync

      # 版本三处一致（package.json / VERSION / CHANGELOG）。本地 `check` 里有这一步，
      # CI 之前漏了 —— 于是「本地漏跑会被 CI 挡住」这句话对这条并不成立。
      - name: version consistency
        run: npm run version:check

      # 配置是**唯一部署源**（config/crwu-workbench.yml）：Schema 不合法或字段缺失时，
      # 本地 `npm run check` / `prepack` 会红，但 CI 是逐条跑的，之前漏了这一步
      # —— 于是坏 YAML 能过 CI、却卡住 `make plugin-pack` / 员工安装。
      - name: config check
        run: npm run config:check

      # 非 vendored 技能的 CLI 静态守卫：活跃指令里不许再出现裸 `crwu`/`dws`/`ossutil`、
      # `which`/`command -v`、`export PATH=`、包内 `bin/<平台>/`。`skills/dws` 是 vendored
      # 上游正文，守卫显式排除它（口径见 `plugins/AGENTS.md` §5.6）。
      - name: skill CLI guard
        run: npm run skills:cli-guard

      - name: typecheck
        run: npm run typecheck

      # `continue-on-error` + 下一步的注解：失败详情必须**能被机器读到**。
      # job log 的 REST 接口要仓库 admin 权限（普通 token 403），而 check-run 注解是公开可读的
      # —— 「windows 上到底哪条测试红了」之前只能靠人翻网页（本轮就吃过这个亏）。
      - name: tests
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: annotate test failures
        if: steps.tests.outcome == 'failure'
        env:
          LOG: ${{ runner.temp }}/test-output.log
        run: |
          # 一条注解装下「失败用例名 + 日志尾部」：GitHub 每个 step 只留有限条注解，
          # 换行用 %0A 编码，这样失败原因（含 AssertionError / 子进程 stderr）不会被我
          # 自己的截断吃掉 —— 这正是排查 windows 那次踩的坑。
          node -e "
            const fs = require('fs')
            const lines = String(fs.readFileSync(process.env.LOG, 'utf8')).split(/\r?\n/)
            const fails = lines.filter((line) => /^✖ /.test(line)).slice(0, 6)
            const body = [...fails, '———— 日志尾部 ————', ...lines.slice(-45)].join('%0A')
            console.log('::error::' + body.slice(0, 6000))
          "
          exit 1

      - name: build
        run: npm run build

      # 真实 tarball 的文件清单 + 加载契约。改 files / exports / publishConfig 时这是唯一的护栏，
      # 之前只靠发布前的 prepublishOnly，PR 阶段挡不住。
      - name: assert packed tarball
        run: npm run pack:assert

      # 构建产物冒烟：真跑 lib/index.js 的同源路由与 lib/client.js 的 ModuleLoader 加载。
      # tests/ 里的测试全部 import src 源码，证明不了打出来的东西能被 DSH 加载。
      - name: built-artifact smoke
        run: npm run smoke:built

      - name: assert build artifacts
        run: |
          test -f lib/index.js
          test -f lib/client.js
          node -e "const fs=require('fs');const c=fs.readFileSync('lib/client.js','utf8');if(!c.includes('__ModuleLoader__'))throw new Error('lib/client.js 缺少 DSH ModuleLoader 包装')"

      # DSH 运行时兼容矩阵：**真的**在干净临时工程里装齐 DSH 0.1.7 与 0.2.0 的完整 peer 集，
      # 再把本插件的 tarball 装进去，最后调用 DSH 自己的 `evaluatePluginCompatibility()`
      # 断言它不会被 skip / disable，并用**该版本**的 DSH 类型跑一次 tsc。
      #
      # 为什么必须真的装：2026-09-28 的事故是 peer 区间只覆盖 0.1 系列、DSH 0.2 直接禁用整包，
      # 而当时只有一条「读区间字符串」的单测 —— 它证明不了 DSH 会加载这个包。
      #
      # 只在 Node 22 上跑：这一步与 Node 版本无关（两个 DSH 运行时线各装一遍），
      # 跑两遍只是把 CI 时间翻倍。OS 两平台都覆盖（Linux + Windows 的安装/解析行为不同）。
      - name: DSH runtime compatibility matrix
        if: matrix.node == 22
        run: npm run compat:dsh

  # 原生 PowerShell 合同测试：**DSH 在 Windows 上就是这么跑的** —— 整串命令作为**一个 argv
  # 元素**交给 `pwsh -NoLogo -NoProfile -NonInteractive -Command <整串>`。
  #
  # 为什么单开一个 job：上面 `plugin` 矩阵的 windows job 在 **job 级设了 `shell: bash`**
  # （Git for Windows Bash），它验证的是 bash 的解析，而不是 DSH 真实的 PowerShell 语义 ——
  # 2026-09-28 员工报的 ParserError 正是这一类「本地永远绿、Windows 必红」的缺陷。
  #
  # 这个 job **不设 `shell:`**：runner 默认就是 pwsh，所以每一步都由 PowerShell 执行。
  # 内容：静态门禁 + 方言表格（host-platform-shell）+ 原生执行合同（tests/windows/），
  # 再走一遍 build / smoke / 全量 npm test（其中 host-package 会真跑 npm pack + install，
  # 安装链路会执行 `prepare`，正好验证它不再依赖 shell 找 `tsdown.cmd`）。
  windows-powershell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/dsh-crwu-workbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/dsh-crwu-workbench/package-lock.json

      # 先证明这个 job 真的跑在 PowerShell 上：否则「原生 pwsh 覆盖」就是一句空话。
      - name: assert the runner shell is PowerShell
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "需要 PowerShell 7（pwsh），实际 $($PSVersionTable.PSVersion)" }

      - run: npm ci

      - name: 静态门禁 + 方言表格
        run: node --test tests/unit/host-platform-shell.test.mjs

      - name: 原生 PowerShell 执行合同
        run: node --test tests/windows/powershell-contract.test.mjs

      - name: build（prepare 不再靠 shell 找 tsdown.cmd）
        run: npm run build

      - name: built-artifact smoke
        run: npm run smoke:built

      # 全量单元/集成测试也放到原生 pwsh 下跑一遍：`prepare` 的跨平台启动、`npm pack/install`
      # 回归、路径与凭据权限的 Windows 分支都在这里。日志 tee 到文件，失败时上传为 artifact。
      - name: tests under native PowerShell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'native-pwsh-tests.log'
          npm test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 失败时上传合同测试日志。**只上传测试输出**：不含凭据、不 dump 环境变量。
      - name: upload native PowerShell logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-powershell-logs
          path: ${{ runner.temp }}/native-pwsh-tests.log
          if-no-files-found: ignore
